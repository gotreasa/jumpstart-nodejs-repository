version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    # A dependency joins the first group it matches, so tool families
    # (whose packages pin or peer each other) come before the catch-all
    groups:
      babel:
        patterns:
          - '@babel/*'
      stryker:
        patterns:
          - '@stryker-mutator/*'
      commitlint:
        patterns:
          - '@commitlint/*'
      jest:
        patterns:
          - 'jest'
          - 'jest-config'
          - 'babel-jest'
      bats:
        patterns:
          - 'bats'
          - 'bats-*'
      lint-and-format:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - 'globals'
          - 'prettier'
          - 'prettier-*'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
