version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    # Packages that pin or peer each other must move in one PR
    groups:
      babel:
        patterns:
          - '@babel/*'
      stryker:
        patterns:
          - '@stryker-mutator/*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
